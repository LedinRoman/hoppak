<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Хоппак — управление игрой</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111320; color: #ececf4; }
    body { max-width: 65rem; margin: auto; padding: 2rem 1rem; }
    section { border-top: 1px solid #35374a; padding-block: 1rem; }
    h1, h2, h3 { line-height: 1.2; }
    form, .reports { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
    .reports { align-items: start; }
    label { display: grid; gap: .3rem; }
    input, button { font: inherit; padding: .45rem .65rem; border: 1px solid #60637b; border-radius: .35rem; }
    input[type=number] { width: 5rem; }
    button { background: #d8cdff; color: #19112e; cursor: pointer; font-weight: 650; }
    button:disabled { opacity: .55; cursor: wait; }
    table { border-collapse: collapse; }
    th, td { padding: .3rem .7rem; text-align: left; border-bottom: 1px solid #35374a; }
    [role=status] { min-height: 1.5em; color: #ded4ff; }
  </style>
</head>
<body>
  <h1>Управление Хоппаком</h1>
  <label>Токен администратора <input id="token" type="password" autocomplete="off" spellcheck="false" required></label>

  <section aria-labelledby="telemetry">
    <h2 id="telemetry">Телеметрия забегов</h2>
    <form id="report">
      <label>С даты (UTC) <input name="from" type="date"></label>
      <label>По дату (UTC) <input name="to" type="date"></label>
      <button>Показать</button>
    </form>
    <p id="report-status" role="status"></p>
    <div id="reports" class="reports"></div>
  </section>

  <section aria-labelledby="visual">
    <h2 id="visual">Контраст</h2>
    <form id="contrast">
      <label>Фон <input name="bg" type="number" min="50" max="110" step="1" required></label>
      <label>Платформы <input name="platforms" type="number" min="50" max="110" step="1" required></label>
      <label>Герой <input name="hero" type="number" min="50" max="110" step="1" required></label>
      <label>Монстры <input name="mobs" type="number" min="50" max="110" step="1" required></label>
      <label>Монеты <input name="coins" type="number" min="50" max="110" step="1" required></label>
      <button disabled>Сохранить</button>
    </form>
    <p id="contrast-status" role="status"></p>
  </section>

  <script>
    const token = document.getElementById('token');
    const report = document.getElementById('report');
    const reports = document.getElementById('reports');
    const contrast = document.getElementById('contrast');
    const heroNames = ['Капитан', 'Пират', 'Ниндзя', 'Робот', 'Маг', 'Рыцарь'];
    const number = new Intl.NumberFormat('ru', { maximumFractionDigits: 2 });
    const fields = [...contrast.querySelectorAll('input')];

    function auth() {
      if (!token.reportValidity()) throw new Error('Введите токен администратора');
      return { Authorization: 'Bearer ' + token.value };
    }

    async function request(url, options) {
      const response = await fetch(url, { cache: 'no-store', ...options });
      if (response.status === 401) throw new Error('Неверный токен администратора');
      if (!response.ok) throw new Error('Ошибка запроса (' + response.status + ')');
      return response.json();
    }

    function table(title, headers, rows) {
      const group = document.createElement('div');
      const heading = document.createElement('h3');
      heading.textContent = title;
      group.append(heading);
      const table = document.createElement('table');
      const header = table.createTHead().insertRow();
      for (const name of headers) {
        const th = document.createElement('th');
        th.scope = 'col';
        th.textContent = name;
        header.append(th);
      }
      const body = table.createTBody();
      for (const row of rows) {
        const tr = body.insertRow();
        for (const value of row) tr.insertCell().textContent = value;
      }
      group.append(table);
      reports.append(group);
    }

    report.addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.getElementById('report-status');
      const button = report.querySelector('button');
      const params = new URLSearchParams();
      for (const [name, value] of new FormData(report)) if (value) params.set(name, value);
      reports.replaceChildren();
      button.disabled = true;
      try {
        const data = await request('/api/admin/telemetry?' + params, { headers: auth() });
        status.textContent = data.days.length ? '' : 'За выбранный период нет завершённых забегов.';
        if (!data.days.length) return;
        table('По дням', ['Дата', 'Забеги', 'Средняя высота, м'],
          data.days.map((d) => [d.date, d.runs, number.format(d.avgHeight)]));
        table('Причины завершения', ['Причина', 'Забеги'], data.causes.map((d) => [d.cause, d.n]));
        table('Герои', ['Герой', 'Забеги', 'Доля'],
          data.heroes.map((d) => [heroNames[d.hero] || d.hero, d.n, number.format(d.pct) + '%']));
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    const contrastStatus = document.getElementById('contrast-status');
    const saveContrast = contrast.querySelector('button');
    request('/api/config/visual').then((values) => {
      for (const field of fields) field.value = values[field.name];
      saveContrast.disabled = false;
    }).catch((error) => { contrastStatus.textContent = error.message; });

    contrast.addEventListener('submit', async (event) => {
      event.preventDefault();
      saveContrast.disabled = true;
      contrastStatus.textContent = '';
      try {
        const headers = { ...auth(), 'Content-Type': 'application/json' };
        const body = JSON.stringify(Object.fromEntries(fields.map((field) => [field.name, field.valueAsNumber])));
        await request('/api/admin/config/visual', { method: 'PUT', headers, body });
        contrastStatus.textContent = 'Контраст сохранён.';
      } catch (error) {
        contrastStatus.textContent = error.message;
      } finally {
        saveContrast.disabled = false;
      }
    });
  </script>
</body>
</html>
